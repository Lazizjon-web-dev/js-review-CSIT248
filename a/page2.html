<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page 2</title>
</head>
<body>
  <h1>Page 2</h1>
  <p>History length: <span id="history-length"></span></p>
  <button type="button" onclick="history.back()">Back</button>
  <button type="button" onclick="history.forward()">Forward</button>
  <p><a href="page1.html">Go to Page 1</a></p>

  <script>
    window.addEventListener("load", () => {
      document.getElementById("history-length").textContent = history.length;
    });
  </script>
</body>
</html>
